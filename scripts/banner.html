<!doctype html>
<!-- The README header and GitHub social preview (1280x640). Render: scripts/render-banner.sh -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1280px;height:640px;background:#fffdf8;color:#17171a;font-family:Inter,sans-serif;overflow:hidden}
  .wrap{position:relative;width:1280px;height:640px;box-sizing:border-box;padding:64px 72px;display:grid;grid-template-columns:600px 1fr;gap:40px;align-items:center}
  .logo{height:54px;display:block;margin-bottom:46px}
  h1{font:800 92px/0.98 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:0}
  mark{background:#c8f031;color:inherit;padding:0 .12em;border-radius:8px}
  p{font-size:28px;line-height:1.35;margin:28px 0 0;max-width:540px;font-weight:500}
  .file{display:inline-block;margin-top:34px;font:700 22px/1 ui-monospace,Menlo,monospace;background:#f7b6c8;border:3px solid #17171a;border-radius:12px;padding:10px 16px;box-shadow:0 5px 0 #17171a}
  .art{border:4px solid #17171a;border-radius:26px;overflow:hidden;box-shadow:0 10px 0 #17171a;background:#fff}
  .art img{display:block;width:100%}
</style></head>
<body><div class="wrap">
  <div>
    <img class="logo" src="../../studio-lab-web-cartoon/public/logo.svg" alt="VNTOS">
    <h1>Claude <mark>skills</mark>, the ones I use every day</h1>
    <p>Free, and each one is a single file you can read.</p>
    <span class="file">SKILL.md</span>
  </div>
  <div class="art"><img src="../../studio-lab-web-cartoon/public/look/skill-meeting-prep-placeholder.jpg" alt=""></div>
</div></body></html>
